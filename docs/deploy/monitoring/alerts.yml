groups:
  - name: fy-api-availability
    interval: 30s
    rules:
      # TraceNex HTTP 可用性(黑盒探测)
      - alert: FyApiDown
        expr: probe_success{job="blackbox-fy-api"} == 0
        for: 2m
        labels: { severity: critical, team: sre }
        annotations:
          summary: "TraceNex {{ $labels.instance }} 不可达超过 2 分钟"
          description: "probe_success=0,立刻查容器状态和日志"

      # 响应时间
      - alert: FyApiHighLatency
        expr: probe_duration_seconds{job="blackbox-fy-api"} > 2
        for: 5m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "TraceNex 响应延迟 > 2s 持续 5min"
          description: "{{ $labels.instance }} duration={{ $value }}s"

      # TLS 证书 15 天内到期
      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 15 * 24 * 3600
        for: 1h
        labels: { severity: warning, team: sre }
        annotations:
          summary: "TraceNex TLS 证书剩余 < 15 天"

  - name: fy-api-resources
    interval: 30s
    rules:
      # 宿主机 CPU > 85%
      - alert: NodeHighCPU
        expr: (1 - avg by (instance)(irate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 85
        for: 10m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "{{ $labels.instance }} CPU > 85% 10min"

      # 宿主机内存 > 90%
      - alert: NodeHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "{{ $labels.instance }} 内存 > 90% 5min"

      # 磁盘 > 85%
      - alert: NodeDiskAlmostFull
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs"} - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 85
        for: 10m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} 磁盘 > 85%"

      # TraceNex 容器占用
      - alert: FyApiContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"fy-api.*"}[5m]) * 100 > 80
        for: 10m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "容器 {{ $labels.name }} CPU > 80% 10min"

      - alert: FyApiContainerOOMApproaching
        expr: container_memory_usage_bytes{name=~"fy-api.*"} / container_spec_memory_limit_bytes{name=~"fy-api.*"} > 0.9
        for: 5m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "容器 {{ $labels.name }} 内存 > 90% limit"

      # 容器被重启
      - alert: ContainerRestarted
        expr: changes(container_start_time_seconds{name=~"fy-api.*"}[15m]) > 0
        for: 1m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "容器 {{ $labels.name }} 最近 15min 重启过"

  - name: fy-api-database
    interval: 30s
    rules:
      # MySQL 连接数 > 70%
      - alert: MySQLHighConnections
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.7
        for: 5m
        labels: { severity: warning, team: dba }
        annotations:
          summary: "MySQL 连接占用 > 70%,检查 TraceNex SQL_MAX_OPEN_CONNS"

      # MySQL 慢查询速率
      - alert: MySQLSlowQueriesHigh
        expr: rate(mysql_global_status_slow_queries[5m]) > 5
        for: 10m
        labels: { severity: warning, team: dba }
        annotations:
          summary: "MySQL 慢查询 > 5 条/s"

      # MySQL 不可达
      - alert: MySQLDown
        expr: mysql_up == 0
        for: 1m
        labels: { severity: critical, team: dba }
        annotations:
          summary: "MySQL unreachable"

      # Redis 内存 > 80%
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels: { severity: warning, team: sre }

      # Redis 不可达
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical, team: sre }

  - name: fy-api-cache-affinity
    interval: 30s
    rules:
      # 缓存命中率过低（按渠道，15min 窗口）
      - alert: LowCacheHitRate
        expr: |
          sum(rate(fy_relay_cached_tokens_total[15m])) by (channel_id)
          / sum(rate(fy_relay_prompt_tokens_total[15m])) by (channel_id) < 0.2
        for: 10m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "ch#{{ $labels.channel_id }} 缓存命中率 < 20% 持续 10min"
          description: "可能原因：亲和性 TTL 过短、渠道切换频繁、或客户端未传 cache_control"

      # 亲和性命中率过低
      - alert: LowAffinityHitRate
        expr: |
          sum(rate(fy_affinity_lookups_total{outcome="hit"}[15m]))
          / sum(rate(fy_affinity_lookups_total[15m])) < 0.5
        for: 10m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "亲和性命中率 < 50%，可能 TTL 过短或规则未覆盖"

      # 亲和性缓存条目接近上限
      - alert: AffinityEntriesHigh
        expr: fy_affinity_active_entries > 80000
        for: 5m
        labels: { severity: warning, team: sre }
        annotations:
          summary: "{{ $labels.rule_name }} 亲和性缓存条目 > 80K（上限 100K），考虑扩容或缩短 TTL"
