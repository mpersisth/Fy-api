# fy_eval sample config — channel evaluation
# Copy to eval-xxx.local.yaml and fill in real values

channel:
  name: "供应商A"
  pin_channel_id: 30
  base_url: ${FY_BASE_URL:-http://localhost:3000}
  user_token: ${FY_USER_TOKEN}

# Text models to evaluate (omit section entirely to skip)
text_models:
  models: ["claude-sonnet-4-20250514", "gpt-4o", "deepseek-chat"]
  tests:
    smoke: true
    load:
      concurrency: 5
      duration_sec: 60
    quality:
      sample_count: 10
    canary: false

# Image models to evaluate
# Set models to "auto" or omit to auto-detect supported models
image_models:
  models: ["gpt-image-1", "flux-1-pro"]
  # models: auto
  tests:
    smoke: true
    load:
      concurrency: 2
      duration_sec: 60
      # Parameter matrix: list dimension values, auto-generates all combinations
      # e.g. 2 sizes × 2 qualities = 4 test groups
      matrix:
        size: ["1024x1024", "1536x1024"]
        quality: ["low", "high"]
    quality:
      enabled: false
      judge_model: "gpt-4o"
    safety: true

# Video models to evaluate (omit to skip)
video_models:
  models: ["wan2.1-t2v"]
  tests:
    smoke: true
    load:
      concurrency: 1
      max_requests: 2
      # Parameter matrix: auto-generates combinations
      matrix:
        duration: ["5s", "10s"]
        resolution: ["720p", "1080p"]

report:
  output_dir: "eval-results"
