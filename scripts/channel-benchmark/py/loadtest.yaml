# Fy-api load-test example config
#
# Copy to loadtest.local.yaml, fill in env vars, run:
#   fy-loadtest -c loadtest.local.yaml
#
# This tool is BILLED to gateway.user_token — it sends real chat requests to
# your Fy-api over /v1/chat/completions. Cap the user's quota as a safety net.

gateway:
  base_url: "${FY_API_URL:-http://localhost:3000}"
  user_token: "${FY_API_USER_TOKEN}"

  # Optional. When set, every load-test request appends "-{pin_channel_id}" to
  # user_token, forcing Fy-api's distributor to land all traffic on this exact
  # channel (admin-only; see middleware/auth.go ~line 431). user_token MUST
  # belong to an admin user — otherwise the gateway 403s.
  #
  # Recommended ON when load-testing one channel; without it a model offered
  # by N channels would be balanced across them and the throughput numbers
  # wouldn't say anything about any single channel.
  # pin_channel_id: 8

  # Multi-channel comparison: list channels to test sequentially and compare.
  # Each channel needs a name and pin_channel_id (admin token required).
  # channels:
  #   - name: "Anthropic Direct"
  #     pin_channel_id: 26
  #   - name: "AWS Bedrock"
  #     pin_channel_id: 30

load:
  model: gpt-4o-mini
  prompt: "Reply with the single word: pong."
  max_tokens: 64
  temperature: 0.0
  stream: true

  # Concurrency sweep. Short runs for smoke; extend for capacity planning.
  # Rule of thumb: each level is ~(requests_per_level × avg_e2e_s / C) seconds.
  concurrency_levels: [1, 10, 30, 50, 100]
  requests_per_level: 30
  warmup_requests: 3
  request_timeout_sec: 120

# Optional. When set, 'goodput' = req/s that meet ALL specified thresholds.
# Leave thresholds as null to skip; any present threshold is enforced.
slo:
  ttft_p95_ms: 2000
  itl_p95_ms: 100
  e2e_p95_ms: null

export:
  formats: [json, csv, markdown, pdf]
  output_dir: "loadtest-results"
