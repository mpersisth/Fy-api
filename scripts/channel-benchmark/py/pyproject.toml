[project]
name = "fy-channel-qa"
version = "0.4.0"
description = "Load, quality, substitution-detection, and protocol-conformance harness for Fy-api channels (OpenAI-compatible)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "Fy-api team" }]

# Base deps — only what fy_loadtest needs. Layers 2 and 3 add extras below so
# users who only want load testing don't pull in torch, matplotlib, etc.
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.7",
    "reportlab>=4.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Load-tester-only extras (kept for back-compat; base install already covers it).
load = []

# Quality-eval extras: needs nothing heavy. Everything here is pure-python.
quality = []

# Canary detection: model-equality-testing drags torch+matplotlib (~1.5GB).
# Kept in its own extra so the base install stays lean.
canary = [
    "model-equality-testing>=0.0.2",
    "numpy>=1.26",
]

# Image canary: CLIP embeddings + Pillow for vendor comparison.
# ~2 GB download; kept in its own extra.
image-canary = [
    "torch>=2.0",
    "transformers>=4.36",
    "Pillow>=10.0",
    "numpy>=1.26",
]

# Optional local tokenization (Fy-api should return `usage`; kept as fallback).
tiktoken = ["tiktoken>=0.7"]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
fy-loadtest    = "fy_loadtest.cli:main"
fy-quality     = "fy_quality.cli:main"
fy-canary      = "fy_canary.cli:main"
fy-conformance = "fy_conformance.cli:main"
fy-image-conformance = "fy_image_conformance.cli:main"
fy-image-loadtest = "fy_image_loadtest.cli:main"
fy-image-canary = "fy_image_canary.cli:main"
fy-eval        = "fy_eval.cli:main"
fy-score       = "fy_score.cli:main"
fy-integrity   = "fy_integrity.cli:main"
fy-cache-affinity = "fy_cache_affinity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fy_loadtest", "fy_quality", "fy_canary", "fy_conformance", "fy_image_conformance", "fy_image_loadtest", "fy_image_canary", "fy_eval", "fy_score", "fy_integrity", "fy_cache_affinity"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tests_quality", "tests_canary", "tests_conformance", "tests_integrity", "tests_cache_affinity", "tests_image_canary"]
